<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0c0c0c;font-family:'Oswald',sans-serif;overflow-x:hidden}

.collage{
  display:grid;
  width:100%;
  max-width:1600px; /* Сделали мейн шире */
  margin:0 auto;
  padding:10px;
  gap:15px; /* Чуть увеличил отступ, чтобы круглые края смотрелись лучше */
  
  /* Умная сетка, чтобы влезли все фото */
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  grid-auto-rows: 350px; 
}

.cell{
  position:relative;overflow:hidden;cursor:pointer;
  transition:transform .28s cubic-bezier(.22,.68,0,1.35),
             box-shadow .28s ease;
  z-index:1;
  border-radius: 20px; /* Добавили закругленные края */
  background: #111; /* Темный фон для ячеек */
  display: flex;
  justify-content: center;
  align-items: center;
}

.cell:hover{
  transform:scale(1.05) translateY(-5px);
  box-shadow:0 20px 50px rgba(0,0,0,.9),0 0 0 2px #e8c84a;
  z-index:20;
}

.cell img{
  width:100%;height:100%;
  object-fit:contain; /* Фотки теперь не обрезаются */
  display:block;
  transition:filter .3s;
  border-radius: 20px; /* Закругляем сами фото */
}

.cell:hover img{filter:brightness(1.12) saturate(1.2)}

.cell::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(232,200,74,.1) 0%,transparent 50%);
  opacity:0;transition:opacity .3s;pointer-events:none;z-index:2;
  border-radius: 20px;
}
.cell:hover::before{opacity:1}

.tag{
  position:absolute;bottom:10px;left:10px;
  background:rgba(232,200,74,.92);color:#0a0a0a;
  font-size:12px;font-weight:700;text-transform:uppercase;
  letter-spacing:1.5px;padding:5px 12px;
  border-radius: 8px; /* Сделал теги тоже немного закругленными */
  opacity:0;transition:opacity .2s;z-index:3;pointer-events:none;
}
.cell:hover .tag{opacity:1}

/* gold border flash on load */
@keyframes flash{0%{box-shadow:0 0 0 2px #e8c84a}100%{box-shadow:none}}

footer{padding:48px 20px 60px;text-align:center;position:relative}
footer::before{
  content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);
  width:300px;height:1px;
  background:linear-gradient(90deg,transparent,#e8c84a 40%,#ff6b9d 60%,transparent);
}
.hearts{display:flex;justify-content:center;gap:8px;margin-bottom:14px}
.hearts span{font-size:16px;color:#cc2244;animation:hb 1.4s ease-in-out infinite}
.hearts span:nth-child(2){animation-delay:.2s}
.hearts span:nth-child(3){animation-delay:.4s}
@keyframes hb{0%,100%{transform:scale(1);opacity:.6}50%{transform:scale(1.5);opacity:1}}
.ftxt{
  font-family:'Dancing Script',cursive;font-weight:700;
  font-size:clamp(34px,8vw,76px);letter-spacing:3px;
  background:linear-gradient(135deg,#e8c84a 0%,#ff6b9d 35%,#c084fc 65%,#e8c84a 100%);
  background-size:300% 300%;
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  animation:shine 4s ease-in-out infinite;
}
@keyframes shine{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.fsub{margin-top:10px;font-size:11px;letter-spacing:6px;text-transform:uppercase;color:#888}

</style>
